[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "corral-inference-opt"
version = "0.1.0"
description = "Inference-time optimization environment for frozen student LLMs."
requires-python = ">=3.11"
dependencies = ["corral", "requests>=2.32.3"]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[tool.setuptools.packages.find]
include = ["inference_opt*"]
